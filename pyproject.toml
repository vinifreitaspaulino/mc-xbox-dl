[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-xbox-dl"
version = "0.1.0"
description = "CLI tool to list, download, and backup Minecraft Bedrock (Xbox) cloud saves as .mcworld packages"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vinicius de Freitas Paulino" }]
keywords = ["minecraft", "bedrock", "xbox", "cloud-save", "mcworld"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography>=42.0.0",
    "httpx>=0.25.0",
    "platformdirs>=3.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "respx>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
mc-xbox-dl = "mc_xbox_dl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

